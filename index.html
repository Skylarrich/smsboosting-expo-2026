<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SMSBoosting展会助手</title>
<style>
:root {
  --green: #005a4a;
  --green-dark: #003d32;
  --green-light: #e8f0ed;
  --gold: #c8962e;
  --gold-soft: #fef6e7;
  --stone: #f2f0eb;
  --stone-dark: #e3e0d8;
  --ink: #1a1a1a;
  --muted: #6b6b6b;
  --card: #ffffff;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.06);
  --shadow-md: 0 4px 14px rgba(0,0,0,.07);
  --shadow-lg: 0 12px 32px rgba(0,0,0,.09);
  --radius: 12px;
  --radius-lg: 18px;
  --font-display: "Plus Jakarta Sans","Inter",system-ui,-apple-system,sans-serif;
  --font-body: "Inter",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);color:var(--ink);background:var(--stone);min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:0}
a{color:var(--green);text-decoration:none}
.app{max-width:1280px;margin:0 auto;padding:0 20px 40px}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:18px 0 16px;border-bottom:1px solid var(--stone-dark);
  background:linear-gradient(180deg,#fff 0%,var(--stone) 100%);
}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:44px;height:44px;border-radius:10px;object-fit:contain;background:#fff;box-shadow:var(--shadow-sm)}
.brand h1{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.01em;color:var(--ink);margin:0}
.brand p{font-size:12px;color:var(--muted);margin:3px 0 0;font-weight:400}
.btn{
  display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 18px;
  border-radius:999px;font-size:14px;font-weight:600;
  border:1px solid var(--stone-dark);background:#fff;color:var(--ink);
  transition:all .12s ease;white-space:nowrap;
}
.btn:hover{border-color:var(--green);color:var(--green);box-shadow:var(--shadow-sm)}
.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.btn.primary:hover{background:var(--green-dark);color:#fff;box-shadow:var(--shadow-md)}
.btn.ghost{background:transparent;border:0;padding:0 12px}
.toolbar{
  position:sticky;top:0;z-index:20;
  background:rgba(242,240,235,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:14px 0 16px;border-bottom:1px solid var(--stone-dark);
}
.searchrow{display:flex;gap:10px;margin-bottom:12px}
.search{
  flex:1;height:44px;border:1px solid var(--stone-dark);border-radius:var(--radius);
  padding:0 16px;background:#fff;outline:0;font-size:15px;
  box-shadow:var(--shadow-sm);transition:.12s ease;
}
.search:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,90,74,.12)}
.filters{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.filter{position:relative}
.filterBtn{
  width:100%;height:40px;border:1px solid var(--stone-dark);border-radius:var(--radius);
  background:#fff;display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:0 12px;font-size:13px;font-weight:600;transition:.12s;
  box-shadow:var(--shadow-sm);
}
.filterBtn:hover{border-color:var(--green)}
.filterBtn .badge{
  min-width:20px;height:20px;display:inline-grid;place-items:center;
  border-radius:999px;background:var(--green);color:#fff;font-size:11px;font-weight:700;
}
.filterBtn .arrow{font-size:10px;color:var(--muted);transition:transform .2s}
.filter.open .arrow{transform:rotate(180deg)}
.panel{
  display:none;position:absolute;left:0;right:0;top:46px;
  max-height:300px;overflow:auto;background:#fff;border:1px solid var(--stone-dark);
  border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:6px;z-index:50;
}
.filter.open .panel{display:block}
.option{
  display:flex;align-items:center;gap:10px;min-height:36px;padding:6px 8px;
  border-radius:8px;font-size:13px;color:var(--ink);line-height:1.35;
}
.option:hover{background:var(--green-light)}

.filterGroup{padding:4px 0 6px;border-bottom:1px solid var(--stone);margin-bottom:4px}
.filterGroup:last-child{border-bottom:0;margin-bottom:0}
.option.groupAll{font-weight:700;background:#faf9f6}
.option.groupAll.regionParent{padding:0;gap:0;align-items:stretch;justify-content:space-between;overflow:hidden}
.regionToggle{
  flex:1;min-height:36px;display:flex;align-items:center;gap:8px;
  padding:6px 8px;border-radius:8px;text-align:left;font-size:13px;font-weight:700;
}
.regionToggle:hover{background:var(--green-light)}
.regionToggle .chevron{font-size:10px;color:var(--muted);transition:transform .15s ease;display:inline-block}
.filterGroup.regionExpanded .regionToggle .chevron{transform:rotate(90deg)}
.regionCheck{display:flex;align-items:center;gap:8px;min-height:36px;padding:6px 8px;white-space:nowrap}
.regionCheck:hover{background:var(--green-light)}
.regionChildren{display:none;padding-top:2px}
.filterGroup.regionExpanded .regionChildren{display:block}
.option.child{padding-left:28px;color:#4b4b4b}
.option.child span::before{content:"└ ";color:var(--muted)}
.detailHeadActions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.option input{width:16px;height:16px;accent-color:var(--green);flex-shrink:0}
.resetRow{display:flex;justify-content:flex-end;margin-top:6px}
.reset{font-size:12px;color:var(--muted);padding:4px 6px;border-radius:6px}
.reset:hover{background:var(--stone);color:var(--ink)}
.view{display:none}
.view.active{display:block}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-top:22px}
.card{
  background:var(--card);border:1px solid var(--stone-dark);border-radius:var(--radius-lg);
  padding:18px;box-shadow:var(--shadow-sm);
  display:flex;flex-direction:column;gap:10px;
  transition:all .18s ease;cursor:pointer;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:#cdc9c0}
.cardTop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card h3{margin:0;font-size:16px;font-weight:600;line-height:1.35;font-family:var(--font-display)}
.stars{color:var(--gold);font-weight:700;white-space:nowrap;font-size:13px;letter-spacing:1px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{
  display:inline-flex;align-items:center;height:24px;padding:0 8px;
  border-radius:6px;background:var(--green-light);color:var(--green-dark);
  font-size:11px;font-weight:600;
}
.pill.light{background:var(--stone);color:var(--muted)}
.summary{font-size:13px;line-height:1.55;color:#4b4b4b;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cardActions{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.linkBtn{font-size:13px;font-weight:700;color:var(--green);padding:4px 0}
.linkBtn:hover{text-decoration:underline}
.fav{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--stone-dark);
  background:#fff;display:grid;place-items:center;font-size:16px;color:var(--muted);
  transition:.12s;flex-shrink:0;
}
.fav:hover{border-color:var(--gold);color:var(--gold)}
.fav.on{background:var(--gold-soft);color:var(--gold);border-color:#f0dba8}
.empty{
  margin:32px auto;max-width:600px;background:#fff;border:1px dashed var(--stone-dark);
  border-radius:var(--radius-lg);padding:40px 24px;text-align:center;color:var(--muted);font-size:14px;
}
.detail{
  max-width:880px;margin:20px auto 0;background:#fff;border:1px solid var(--stone-dark);
  border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-md);
}
.detailHead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}
.detail h2{margin:8px 0;font-size:26px;font-family:var(--font-display);font-weight:700;line-height:1.25}
.detailGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.info{background:var(--stone);border-radius:var(--radius);padding:10px 12px}
.info b{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.info span{font-size:13px;line-height:1.45;color:var(--ink)}
.section{margin:16px 0 0}
.section h4{margin:0 0 6px;font-size:14px;font-weight:700}
.section p{margin:0;line-height:1.65;color:#4b4b4b;font-size:13px}
.detailActions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.favList{max-width:880px;margin:20px auto 0}
.favHeader{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.favHeader h2{margin:0;font-size:22px;font-family:var(--font-display)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);z-index:100;opacity:0;pointer-events:none;transition:.18s ease}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
.warn{background:var(--gold-soft);border:1px solid #f5dba8;color:#7a5e00;padding:10px 14px;border-radius:var(--radius);margin-top:10px;display:none;font-size:13px}
@media(max-width:1000px){.filters{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr 1fr}}
@media(max-width:680px){
  .app{padding:0 12px 30px}
  .topbar{padding:14px 0;flex-wrap:wrap}
  .logo{width:38px;height:38px}
  .brand h1{font-size:17px}
  .toolbar{padding-top:10px}
  .searchrow{flex-direction:column}
  .search{font-size:16px}
  .filters{grid-template-columns:1fr 1fr;gap:6px}
  .filterBtn{height:38px;font-size:12px;border-radius:8px}
  .filter.open .panel{display:block}
  .panel{position:fixed !important;z-index:999 !important;top:10px !important;left:10px !important;right:10px !important;bottom:10px !important;background:#fff;border-radius:16px !important;padding:10px;padding-bottom:0;border:0 !important;overflow-y:auto !important;-webkit-overflow-scrolling:touch}
  .grid{grid-template-columns:1fr;gap:12px;padding-top:16px}
  .card{border-radius:var(--radius);padding:14px}
  .detail{border-radius:var(--radius);padding:16px;margin-top:14px}
  .detail h2{font-size:20px}
  .detailGrid{grid-template-columns:1fr}
  .detailHead{flex-direction:column}
  .detailHeadActions{width:100%;justify-content:stretch}
  .detailHeadActions .btn{flex:1;justify-content:center}
  .detailActions .btn{width:100%;justify-content:center}
}
@media(prefers-reduced-motion:reduce){
  *,.card,.card:hover,.btn,.toast,.fav{transition:none!important;transform:none!important}
}
</style>
</head>

  <main id="favView" class="view"></main>
</div>
<div class="toast" id="toast">已复制</div>
<script>
(() => {
  const dataNode = document.getElementById('events-data');
  let EVENTS = [];
  try { EVENTS = JSON.parse(dataNode.textContent || '[]'); } catch (err) { showWarning('数据读取失败：' + err.message); EVENTS = []; }

  const favKey = 'smsboosting_aug_dec_2026_favs_fixed_v8';
  const state = {
    view: 'list',
    query: '',
    selected: {
      month: new Set(),
      type: new Set(),
      region: new Set(),
      industry: new Set(),
      purpose: new Set(),
      starsText: new Set(['★★★★★'])
    },
    currentId: null,
    openFilter: null,
    openRegionGroups: new Set(),
    favs: new Set(loadFavs())
  };

  const filterDefs = [
    ['month','月份'], ['type','活动类型'], ['region','地区/国家'], ['industry','行业'], ['purpose','参展目的'], ['starsText','推荐程度']
  ];
  const order = {
    month:['2026年8月','2026年9月','2026年10月','2026年11月','2026年12月'],
    starsText:['★★★★★','★★★★☆','★★★☆☆'],
    region:['中国','东南亚','印度','中东','日韩','澳洲','欧洲','美国','北美/加拿大','拉美','非洲','线上','其他'],
    type:['展会','会议','峰会','论坛','活动','线上活动']
  };
  const industryLabelMap = {
    '金融科技':'FinTech (金融科技)', '支付':'Payments (支付)', '数字银行':'Digital Banking (数字银行)',
    '通信':'Telecom (通信)', 'A2P':'A2P Messaging (A2P)', 'CPaaS':'CPaaS (通信平台)',
    '电商':'E-commerce (电商)', '零售':'Retail (零售)', 'CX':'Customer Experience (客户体验)',
    '营销':'Marketing (营销)', 'MarTech':'MarTech (营销科技)', 'SaaS':'SaaS (软件服务)',
    '企业科技':'Enterprise Tech (企业科技)', 'AI':'AI (人工智能)', '物流':'Logistics (物流)',
    '供应链':'Supply Chain (供应链)', '制造':'Manufacturing (制造)', '工业':'Industrial (工业)',
    '包装':'Packaging (包装)', 'Crypto':'Crypto (加密资产)', 'Web3':'Web3 (Web3)',
    'Trading':'Trading (交易)', 'Gaming':'Gaming (游戏)', '游戏':'Gaming (游戏)',
    '娱乐':'Entertainment (娱乐)', '安防':'Security (安防)', '安全':'Security (安全)',
    '连锁加盟':'Franchise (连锁加盟)', '酒店':'Hospitality (酒店)', '旅游':'Travel (旅游)',
    '餐饮':'F&B (餐饮)', '食品':'Food (食品)', '美妆':'Beauty (美妆)',
    '个护':'Personal Care (个护)', '消费电子':'Consumer Electronics (消费电子)',
    '硬件':'Hardware (硬件)', '消费品':'Consumer Goods (消费品)', '生活方式':'Lifestyle (生活方式)',
    '联盟营销':'Affiliate Marketing (联盟营销)'
  };

  const $ = (id) => document.getElementById(id);
  const cards = $('cards');
  const empty = $('empty');
  const filters = $('filters');

  function showWarning(msg) { const w=$('loadWarn'); if(w){w.textContent=msg;w.style.display='block';} }
  function splitField(raw) { return (raw || '').toString().split(/\/|、|，|,/).map(x=>x.trim()).filter(Boolean); }
  function displayOptionLabel(key, value) { return key === 'industry' ? (industryLabelMap[value] || value) : value; }
  function locationRegion(e) { return (e.region || e.country || '其他').toString().trim() || '其他'; }
  function locationCountry(e) { return (e.country || e.region || '国家待确认').toString().trim() || '国家待确认'; }
  function regionRank(region) {
    const arr = order.region || [];
    const idx = arr.indexOf(region);
    return idx >= 0 ? idx : 999;
  }
  function uniqueValues(key) {
    const vals = new Set();
    EVENTS.forEach(e => {
      const raw = (e[key] || '').toString();
      if (!raw) return;
      if (key === 'industry' || key === 'purpose') splitField(raw).forEach(x=>vals.add(x));
      else vals.add(raw.trim());
    });
    let arr = Array.from(vals).filter(Boolean);
    if (order[key]) {
      const rank = new Map(order[key].map((v,i)=>[v,i]));
      arr.sort((a,b)=>(rank.has(a)?rank.get(a):999)-(rank.has(b)?rank.get(b):999) || a.localeCompare(b,'zh-Hans-CN'));
    } else { arr.sort((a,b)=>displayOptionLabel(key,a).localeCompare(displayOptionLabel(key,b),'en')); }
    return arr;
  }
  function locationGroupsHtml() {
    const groups = new Map();
    EVENTS.forEach(e => {
      const region = locationRegion(e);
      const country = locationCountry(e);
      if (!groups.has(region)) groups.set(region, new Set());
      groups.get(region).add(country);
    });
    return Array.from(groups.entries())
      .sort((a,b)=>regionRank(a[0])-regionRank(b[0]) || a[0].localeCompare(b[0],'zh-Hans-CN'))
      .map(([region, countrySet]) => {
        const regionValue = `region:${region}`;
        const checkedRegion = state.selected.region.has(regionValue) ? 'checked' : '';
        const expanded = state.openRegionGroups.has(region);
        const expandedClass = expanded ? ' regionExpanded' : '';
        const countries = Array.from(countrySet).sort((a,b)=>a.localeCompare(b,'zh-Hans-CN'));
        const children = countries.map(country => {
          const value = `country:${region}:${country}`;
          const checked = state.selected.region.has(value) ? 'checked' : '';
          return `<label class="option child"><input type="checkbox" data-filter="region" value="${escapeAttr(value)}" ${checked}><span>${escapeHtml(country)}</span></label>`;
        }).join('');
        return `<div class="filterGroup${expandedClass}" data-region-group="${escapeAttr(region)}">
          <div class="option groupAll regionParent">
            <button class="regionToggle" type="button" data-toggle-region-group="${escapeAttr(region)}" aria-expanded="${expanded ? 'true' : 'false'}"><span class="chevron">▶</span><span>${escapeHtml(region)}</span></button>
            <label class="regionCheck"><input type="checkbox" data-filter="region" value="${escapeAttr(regionValue)}" ${checkedRegion}><span>全部</span></label>
          </div>
          <div class="regionChildren">${children}</div>
        </div>`;
      }).join('');
  }
  function fieldHas(e, key, val) {
    const raw = (e[key] || '').toString();
    if (key === 'region') {
      if (val.startsWith('region:')) return locationRegion(e) === val.slice(7);
      if (val.startsWith('country:')) {
        const [, region, ...countryParts] = val.split(':');
        return locationRegion(e) === region && locationCountry(e) === countryParts.join(':');
      }
      return locationRegion(e) === val || locationCountry(e) === val;
    }
    if (key === 'industry' || key === 'purpose') return splitField(raw).includes(val);
    return raw === val;
  }
  function hasSelection(key) { return state.selected[key] && state.selected[key].size > 0; }
  function matchSelection(e, key) {
    if (!hasSelection(key)) return true;
    for (const val of state.selected[key]) { if (fieldHas(e,key,val)) return true; }
    return false;
  }
  function filteredEvents() {
    const q = state.query.trim().toLowerCase();
    return EVENTS.filter(e => {
      if (q) {
        const blob = [e.name,e.type,e.month,e.date,e.region,e.country,e.city,e.venue,e.industry,e.purpose,e.target,e.summary,e.reason].join(' ').toLowerCase();
        if (!blob.includes(q)) return false;
      }
      return filterDefs.every(([key]) => matchSelection(e,key));
    });
  }
  function renderFilters() {
    filters.innerHTML = filterDefs.map(([key,label]) => {
      const selectedCount = state.selected[key].size;
      const mark = selectedCount ? `<span class="badge">${selectedCount}</span>` : '<span class="arrow">▾</span>';
      const options = key === 'region'
        ? locationGroupsHtml()
        : uniqueValues(key).map(v => {
          const checked = state.selected[key].has(v) ? 'checked' : '';
          return `<label class="option"><input type="checkbox" data-filter="${key}" value="${escapeAttr(v)}" ${checked}><span>${escapeHtml(displayOptionLabel(key, v))}</span></label>`;
        }).join('');
      return `<div class="filter ${state.openFilter===key?'open':''}" data-filter-box="${key}">
        <button class="filterBtn" type="button" data-toggle-filter="${key}"><span>${label}</span>${mark}</button>
        <div class="panel"><div class="optionsWrap">${options}</div><div class="resetRow"><button class="reset" type="button" data-clear-filter="${key}">清空</button></div></div>
      </div>`;
    }).join('');
  }
  function renderList() {
    renderFilters();
    const list = filteredEvents();
    cards.innerHTML = list.map(cardHtml).join('');
    empty.style.display = list.length ? 'none' : 'block';
  }
  function cardHtml(e) {
    const fav = state.favs.has(e.id) ? 'on' : '';
    const place = e.city || e.venue || '地点待确认';
    return `<article class="card" data-id="${escapeAttr(e.id)}" tabindex="0" role="button" aria-label="查看 ${escapeAttr(e.name)} 详情">
      <div class="cardTop"><h3>${escapeHtml(e.name)}</h3><div class="stars">${escapeHtml(e.starsText)}</div></div>
      <div class="meta">
        <span class="pill">${escapeHtml(e.month)}</span><span class="pill">${escapeHtml(e.region || e.country)}</span><span class="pill light">${escapeHtml(place)}</span><span class="pill light">${escapeHtml(e.type)}</span>
      </div>
      <div class="summary">${escapeHtml(e.summary || e.reason || '')}</div>
      <div class="cardActions"><button class="linkBtn" type="button" data-open="${escapeAttr(e.id)}">查看详情</button><button class="fav ${fav}" type="button" data-fav="${escapeAttr(e.id)}" aria-label="收藏">★</button></div>
    </article>`;
  }
  function showView(name) {
    state.view = name;
    ['listView','detailView','favView'].forEach(id => $(id).classList.remove('active'));
    $(name+'View').classList.add('active');
    const toolbar = $('toolbar');
    toolbar.style.display = name === 'list' ? 'block' : 'none';
    window.scrollTo({top:0, behavior:'smooth'});
  }
  function openDetail(id) {
    const e = EVENTS.find(x=>x.id===id); if (!e) return;
    state.currentId = id;
    const fav = state.favs.has(e.id) ? 'on' : '';
    $('detailView').innerHTML = `<section class="detail">
      <div class="detailHead">
        <button class="btn" type="button" data-back>← 返回列表</button>
        <div class="detailHeadActions">
          <button class="btn ${fav}" type="button" data-fav="${escapeAttr(e.id)}">${state.favs.has(e.id) ? '已收藏' : '收藏'}</button>
          <button class="btn primary" type="button" data-go-favs>收藏清单</button>
        </div>
      </div>
      <div class="stars">${escapeHtml(e.starsText)}</div>
      <h2>${escapeHtml(e.name)}</h2>
      <div class="meta"><span class="pill">${escapeHtml(e.month)}</span><span class="pill">${escapeHtml(e.region || e.country)}</span><span class="pill light">${escapeHtml(e.city || e.venue || '地点待确认')}</span><span class="pill light">${escapeHtml(e.type)}</span></div>
      <div class="detailGrid">
        ${info('时间', e.date)} ${info('地点', e.venue || [e.country,e.city].filter(Boolean).join(' / '))}
        ${info('相关行业', e.industry)} ${info('参展目的', e.purpose)}
        ${info('目标客户', e.target)}
        ${info('报名状态', e.regStatus)} ${info('报名费用', [e.feeStatus, e.feeNote].filter(Boolean).join('：'))}
      </div>
      <div class="section"><h4>展会概览</h4><p>${escapeHtml(e.summary || '暂无详细概览。')}</p></div>
      <div class="section"><h4>推荐理由</h4><p>${escapeHtml(e.reason || '按业务匹配度、拓客效率、行业相关度与区域便利性综合评分。')}</p></div>
      ${e.notes ? `<div class="section"><h4>备注</h4><p>${escapeHtml(e.notes)}</p></div>` : ''}
      <div class="detailActions">
        <button class="btn" type="button" data-copy-name="${escapeAttr(e.name)}">复制此活动</button>
        ${e.url ? `<a class="btn primary" href="${escapeAttr(e.url)}" target="_blank" rel="noopener">前往官网了解更多</a>` : ''}
      </div>
    </section>`;
    showView('detail');
  }
  function info(label, value) { return `<div class="info"><b>${escapeHtml(label)}</b><span>${escapeHtml(value || '待确认')}</span></div>`; }
  function renderFavs() {
    const list = EVENTS.filter(e=>state.favs.has(e.id));
    $('favView').innerHTML = `<section class="favList">
      <div class="favHeader"><button class="btn" type="button" data-back>← 返回列表</button><button class="btn primary" type="button" data-copy-favs>复制收藏</button></div>
      <h2>收藏清单</h2>
      ${list.length ? `<div class="grid">${list.map(cardHtml).join('')}</div>` : '<div class="empty">还没有收藏活动。</div>'}
    </section>`;
    showView('fav');
  }
  function toggleFav(id) {
    if (state.favs.has(id)) state.favs.delete(id); else state.favs.add(id);
    saveFavs();
    if (state.view==='list') renderList();
    if (state.view==='detail' && state.currentId) openDetail(state.currentId);
    if (state.view==='fav') renderFavs();
  }
  function loadFavs() {
    try { return JSON.parse(localStorage.getItem(favKey) || '[]'); } catch { return []; }
  }
  function saveFavs() { localStorage.setItem(favKey, JSON.stringify(Array.from(state.favs))); }
  function copyText(text, msg) {
    const done = () => toast(msg || '已复制');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
    else fallbackCopy(text, done);
  }
  function fallbackCopy(text, cb) { const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); cb&&cb(); }
  function toast(msg) { const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(window.__toastTimer); window.__toastTimer=setTimeout(()=>t.classList.remove('show'),1500); }
  function escapeHtml(s) { return (s ?? '').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function escapeAttr(s) { return escapeHtml(s); }

  document.addEventListener('click', (ev) => {
    const interactive = ev.target.closest('button, a, input');
    const card = ev.target.closest('.card');
    if (!interactive) {
      if (card) { openDetail(card.getAttribute('data-id')); return; }
      if (!ev.target.closest('.filter')) { state.openFilter=null; renderFilters(); }
      return;
    }
    const toggleRegionGroup = interactive.getAttribute('data-toggle-region-group');
    if (toggleRegionGroup) {
      if (state.openRegionGroups.has(toggleRegionGroup)) state.openRegionGroups.delete(toggleRegionGroup);
      else state.openRegionGroups.add(toggleRegionGroup);
      state.openFilter = 'region';
      renderFilters();
      return;
    }
    const toggle = interactive.getAttribute('data-toggle-filter');
    if (toggle) { state.openFilter = state.openFilter===toggle ? null : toggle; renderFilters(); return; }
    const clear = interactive.getAttribute('data-clear-filter');
    if (clear) { state.selected[clear].clear(); if (clear==='region') state.openRegionGroups.clear(); state.openFilter=null; renderList(); return; }
    const fav = interactive.getAttribute('data-fav'); if (fav) { toggleFav(fav); return; }
    const open = interactive.getAttribute('data-open');
    if (open) { openDetail(open); return; }
    if (interactive.hasAttribute('data-back')) { showView('list'); renderList(); return; }
    if (interactive.id === 'goFavs' || interactive.hasAttribute('data-go-favs')) { renderFavs(); return; }
    const copyName = interactive.getAttribute('data-copy-name'); if (copyName) { copyText(copyName, '已复制活动名称'); return; }
    if (interactive.hasAttribute('data-copy-favs')) {
      const names = EVENTS.filter(e=>state.favs.has(e.id)).map(e=>e.name).join('\n');
      copyText(names || '', names ? '已复制收藏清单' : '收藏清单为空'); return;
    }
  });
  document.addEventListener('keydown', (ev) => {
    const card = ev.target.closest && ev.target.closest('.card');
    if (card && (ev.key === 'Enter' || ev.key === ' ')) {
      ev.preventDefault();
      openDetail(card.getAttribute('data-id'));
    }
  });
  document.addEventListener('change', (ev) => {
    const input = ev.target.closest('input[type="checkbox"][data-filter]');
    if (!input) return;
    const key = input.dataset.filter, val = input.value;
    if (input.checked) state.selected[key].add(val); else state.selected[key].delete(val);
    renderList();
  });
  $('searchInput').addEventListener('input', (ev) => { state.query = ev.target.value || ''; renderList(); });
  if (!EVENTS.length) showWarning('没有读取到活动数据，请重新生成页面。');
  renderList();
})();
</script>
</body>
</html>
